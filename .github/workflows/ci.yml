name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python tools/privacy_guard.py
      - run: pytest -q
      - name: config smoke test (no network — proves config loads and the pipeline runs on zero rows)
        run: |
          cp -r config.example config
          python radar.py --dry-run --config config

name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - uses: typst-community/setup-typst@v4
      - run: typst --version
      - run: python tools/privacy_guard.py
      - run: pytest -q
      - name: config smoke test (no network — proves config loads and the pipeline runs on zero rows)
        run: |
          cp -r config.example config
          python radar.py --dry-run --config config
      - name: offline demo (whole system on fictional data — typst is present here, so the full path runs)
        run: python tools/demo.py --out demo-ci

# Kill rules: every "never again" you learn becomes a line here, enforced on
# every future posting. A kill quotes the matched line — overrulable, never silent.
comp_floor: 120000            # yearly max below this (posted or body-stated) kills
# Non-remote postings here still pass; '' = remote-only. Both sides are
# normalised the same way (state names become abbreviations, ', United States' is
# dropped) and matched on word boundaries, so one place cannot resolve two ways
# and 'Colorado', 'CO' and 'Denver' all match "Denver, Colorado".
commute_locations: 'Denver|Boulder'
# Body language that means the role is ON-SITE, even when the header claims it
# is remote. A posting that contradicts itself is a real class, and the
# scraper's remote flag is the less reliable of the two claims. Kills as
# `onsite-body`, quoting the matched line like every other kill.
#
# A location matching commute_locations above WINS over this — an on-site role
# in a city you can commute to is a role you want. Negated mentions ("this is
# not an on-site position") are skipped. Set to '' to turn the rule off;
# remove the key entirely and the same default below still applies.
onsite_phrases: 'fully on-?site|100 ?% on-?site|on-?site (?:position|role|job|opportunity)|in[- ]office \d+ days?|in (?:the |our )?office \d+ days?|\d+ days? (?:a |per )?week in (?:the |our )?office|required to (?:be|work) on-?site'

# Phrasing that means a sentence is describing a HYBRID arrangement, not a
# remote role. Checked INSIDE the sentence that carries the remote language, so
# "Tuesdays and Fridays are remote/work from home days" no longer passes as
# remote while "This is a fully remote role. Our office is in Chicago." still
# does. '' restores the untightened override; absent uses the same default.
#
# These only ever defeat a WEAK remote mention ("work from home", "working
# remotely"). A claim about the ROLE — "fully remote", "remote-first", "100%
# remote" — wins over any of them in the same sentence, so "fully remote, with an
# optional desk in our office" stays remote. The one thing that still beats a
# strong claim is a MANDATORY office cadence ("3 days a week in the office"),
# which is a term of the role rather than an option beside it.
hybrid_phrases: '\b(?:mon|tues|wednes|thurs|fri|satur|sun)days?\b|\bhybrid\b|in[- ](?:the |our )?office|on-?site|\d+ days? (?:a |per )?week (?:in|at|on)|in (?:the |our )?office \d+ days?|in[- ]office \d+ days?|(?:work|working) from home \d+ days?'

# The years-of-experience band, read at BOTH ends. A stated floor below
# min_years costs `penalty` points and flags as `junior-band`; a floor at or
# above stretch_years flags as `seniority-stretch` and costs nothing. NEITHER
# ever kills — a band is a weak claim about a req, and the failure it fixes was
# a junior posting RANKING second, not a junior posting being visible.
# Remove the block entirely and both checks are off; there is no default floor.
seniority:
  min_years: 5
  penalty: 15
  stretch_years: 10

rules:
  - name: bdr-scope
    reason: quota or dial-volume language means a sales seat, not an engineering seat
    pattern: 'carry(?:ing)? (?:a |your )?quota|quota[- ]carrying|cold call|\b\d+ (?:dials|calls) per (?:day|week)'
  - name: not-ic
    reason: people-management as primary scope
    pattern: '(?:hire and )?manage a team|direct reports|people management'
  - name: legacy-stack
    reason: personal rule example — roles centered on tools this persona has ruled out
    pattern: '(?:SSIS|SSRS)\s+(?:is|as) (?:the|our) (?:core|primary)'
